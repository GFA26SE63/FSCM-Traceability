trigger: none
pr: none

variables:
  vmImage: windows-latest
  publishDirectory: $(Build.ArtifactStagingDirectory)\publish
  packagePath: $(Build.ArtifactStagingDirectory)\fscm-traceability.zip

stages:
  - stage: Deploy
    displayName: Validate, publish, and deploy
    jobs:
      - deployment: AppService
        displayName: Deploy Traceability code
        environment: traceability-production
        pool:
          vmImage: $(vmImage)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: UseDotNet@2
                  displayName: Install .NET SDK
                  inputs:
                    packageType: sdk
                    version: 10.x
                - script: dotnet restore FSCM.Traceability.slnx
                  displayName: Restore
                - script: dotnet build FSCM.Traceability.slnx --configuration Release --no-restore
                  displayName: Build
                - script: dotnet test FSCM.Traceability.slnx --configuration Release --no-build
                  displayName: Test .NET
                - script: node --test tests/batch-details.test.cjs
                  displayName: Test web UI regression
                - script: dotnet publish FSCM.Traceability.csproj --configuration Release --no-restore --output "$(publishDirectory)"
                  displayName: Publish application
                - task: ArchiveFiles@2
                  displayName: Package publish output
                  inputs:
                    rootFolderOrFile: $(publishDirectory)
                    includeRootFolder: false
                    archiveType: zip
                    archiveFile: $(packagePath)
                    replaceExistingArchive: true
                - task: AzureWebApp@1
                  displayName: Deploy package to Windows App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webApp
                    appName: $(appName)
                    package: $(packagePath)
