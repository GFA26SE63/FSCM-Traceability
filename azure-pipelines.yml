trigger: none
pr: none

parameters:
  - name: imageTag
    displayName: Immutable container image tag
    type: string
    default: $(Build.BuildId)

variables:
  vmImage: ubuntu-latest
  dockerfilePath: $(Build.SourcesDirectory)/Dockerfile

stages:
  - stage: Validate
    displayName: Validate
    jobs:
      - job: Test
        pool:
          vmImage: $(vmImage)
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 10.x
          - script: dotnet restore FSCM.Traceability.slnx
            displayName: Restore
          - script: dotnet build FSCM.Traceability.slnx --configuration Release --no-restore
            displayName: Build
          - script: dotnet test FSCM.Traceability.slnx --configuration Release --no-build
            displayName: Test .NET
          - script: node --test tests/batch-details.test.cjs
            displayName: Test web UI regression

  - stage: Deploy
    displayName: Build image and deploy
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: AppService
        displayName: Deploy Azure App Service container
        environment: traceability-production
        pool:
          vmImage: $(vmImage)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: Docker@2
                  displayName: Build and push image to ACR
                  inputs:
                    command: buildAndPush
                    repository: $(imageRepository)
                    dockerfile: $(dockerfilePath)
                    containerRegistry: $(dockerRegistryServiceConnection)
                    tags: |
                      ${{ parameters.imageTag }}
                - task: AzureWebAppContainer@1
                  displayName: Deploy image to Linux App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(appName)
                    containers: $(containerRegistry)/$(imageRepository):${{ parameters.imageTag }}
