name: Traceability CI
on:
  push:
    branches: [main, feature/hai-sprint]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traceability-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: dotnet restore FSCM.Traceability.slnx
      - run: dotnet build FSCM.Traceability.slnx --configuration Release --no-restore
      - run: node --check wwwroot/app.js
