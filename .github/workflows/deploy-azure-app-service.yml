name: Deploy Traceability to Azure App Service

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag to publish
        required: true
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, publish, and deploy container
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push image
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/fscm-traceability:${{ inputs.image_tag }}
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy image to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ vars.ACR_LOGIN_SERVER }}/fscm-traceability:${{ inputs.image_tag }}
